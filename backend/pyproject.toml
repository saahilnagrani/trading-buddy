[project]
name = "trading-buddy-backend"
version = "0.1.0"
description = "Multi-account Zerodha trading tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "kiteconnect>=5.0",
    "cryptography>=44.0",
    "apscheduler>=3.10",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
